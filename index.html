<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premier League Predictor</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="theme-color" content="#0B1622" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PL Predictor" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --navy:#0B1622; --navyMid:#16283D; --gold:#F4B93A; --ice:#52C7D6;
    --green:#2FAE60; --red:#E14B4B; --silver:#AAB4BD; --bronze:#C97B3D;
    --chalk:#F5F3EC; --ink:#14181C;
    --border:#E2E4E8; --borderInput:#C7CDD4; --zebra:#F1F2F4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--chalk);color:var(--ink);font-family:Inter,sans-serif;}
  .scorebox{width:2.1rem;text-align:center;border-radius:6px;border:1.5px solid var(--borderInput);padding:3px 0;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;}
  .scorebox:focus{outline:none;border-color:var(--navyMid);}
  .scorebox[readonly]{background:#f3f0f5;color:#888;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;}
  table{border-collapse:collapse;width:100%;}
  th,td{border-bottom:1px solid var(--border);}
  .btn{cursor:pointer;border:none;font-family:'Oswald',sans-serif;font-weight:600;}
  .header{background:var(--navy);color:#fff;padding:20px 16px 0;}
  .headerInner{max-width:900px;margin:0 auto;}
  .tag{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:2px;}
  .tabs{display:flex;gap:4px;overflow-x:auto;max-width:900px;margin:14px auto 0;padding:0 16px;}
  .ticker-wrap{overflow:hidden;background:var(--navyMid);border-top:1px solid rgba(244,185,58,0.35);border-bottom:1px solid rgba(244,185,58,0.35);padding:7px 0;margin-top:16px;}
  .ticker-track{display:inline-flex;white-space:nowrap;animation:ticker-scroll 28s linear infinite;}
  .ticker-item{display:inline-flex;align-items:center;padding:0 18px;font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);}
  .ticker-sep{display:inline-flex;align-items:center;color:rgba(244,185,58,0.4);font-size:10px;}
  @keyframes ticker-scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){ .ticker-track{animation:none;} }
  .tab{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;font-size:13px;padding:10px 16px;background:transparent;color:#8CA0B3;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--chalk);color:var(--navy);border-bottom:3px solid var(--gold);}
  .content{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  .card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.12);color:#8CA0B3;}
  .pill.unlocked{background:var(--green);color:var(--navy);border-color:var(--green);}
  .empty{font-size:13px;color:#888;border:1px dashed var(--borderInput);border-radius:10px;padding:24px;text-align:center;}
  input[type=text]{border:1px solid var(--borderInput);border-radius:8px;padding:7px 10px;font-size:14px;font-family:Inter,sans-serif;}
  .addbtn{background:var(--gold);color:var(--navy);font-weight:700;border-radius:8px;padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:5px;}
  select{border:1px solid var(--borderInput);border-radius:8px;padding:6px 10px;font-size:14px;}
  .sticky-col{position:sticky;left:0;z-index:1;}
</style>
</head>
<body>

<div class="header">
  <div class="headerInner">
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="icon-192.png" alt="" width="40" height="40" style="border-radius:10px;flex-shrink:0;" />
      <div>
        <div class="tag">Office Predictions League</div>
        <h1 style="font-size:28px;font-weight:600;margin:2px 0 0;">Premier League Predictor</h1>
      </div>
    </div>
    <p style="margin:8px 0 0;color:#8CA0B3;font-size:14px;">£2 / week · £76 season · 3pts exact score · 1pt correct result</p>
    <div style="margin:10px 0 0;">
      <span id="lockPill" class="pill" onclick="onLockPillClick()">View only · tap to unlock editing</span>
    </div>
  </div>
  <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="content" id="content"></div>

<script>
const ENTRY_FEE = 76;
const TOTAL_GAMEWEEKS = 38;
const EDITOR_PIN = "6288";
let DATA = null;
let isEditor = false;
let activeTab = "standings";
let gwNum = 1;
let ghToken = localStorage.getItem("gh-token") || "";

// ---------- data helpers ----------
function makeId(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function emptyGW(){ return { fixtures:[], predictions:{}, chips:{} }; }
function getGW(n){ return DATA.gameweeks[n] || emptyGW(); }
function seasonHalf(n){ return n<=18 ? "H1" : "H2"; }
function resultSign(h,a){ return h>a?1:(h<a?-1:0); }
function fixturePoints(pred, actual){
  if(!pred || pred.home==="" || pred.away==="" || pred.home==null || pred.away==null) return null;
  if(!actual || actual.home==="" || actual.away==="" || actual.home==null || actual.away==null) return null;
  const ph=+pred.home, pa=+pred.away, ah=+actual.home, aa=+actual.away;
  if(ph===ah && pa===aa) return 3;
  if(resultSign(ph,pa)===resultSign(ah,aa)) return 1;
  return 0;
}
function gwMemberPoints(gw, memberId){
  const preds=(gw.predictions&&gw.predictions[memberId])||{};
  const chip=(gw.chips&&gw.chips[memberId])||{double:false,tripleFixtureId:null};
  let total=0, anyScored=false, exactCount=0; const perFixture={};
  (gw.fixtures||[]).forEach(fx=>{
    const pts=fixturePoints(preds[fx.id], {home:fx.actualHome, away:fx.actualAway});
    perFixture[fx.id]=pts;
    if(pts!==null){ anyScored=true; if(pts===3) exactCount++; let p=pts; if(chip.tripleFixtureId===fx.id) p*=3; total+=p; }
  });
  if(chip.double) total*=2;
  return {total, anyScored, exactCount, perFixture};
}
function chipUsageExcluding(memberId, half, excludeGw){
  let double=0, triple=0;
  Object.entries(DATA.gameweeks).forEach(([gwStr,gw])=>{
    const n=+gwStr; if(n===excludeGw) return; if(seasonHalf(n)!==half) return;
    const chip=(gw.chips&&gw.chips[memberId])||{};
    if(chip.double) double++; if(chip.tripleFixtureId) triple++;
  });
  return {double,triple};
}
function chipUsageSummary(memberId){
  const usage={H1:{double:0,triple:0},H2:{double:0,triple:0}};
  Object.entries(DATA.gameweeks).forEach(([gwStr,gw])=>{
    const n=+gwStr; const half=seasonHalf(n);
    const chip=(gw.chips&&gw.chips[memberId])||{};
    if(chip.double) usage[half].double++; if(chip.tripleFixtureId) usage[half].triple++;
  });
  return usage;
}
const DEFAULT_PRIZE = { entryFee: 76, first: 1000, second: 360, third: 160 };
function setCurrentGameweek(n){
  if(!isEditor) return;
  DATA.currentGameweek = n;
  render();
}
function toggleGWLock(){
  if(!isEditor) return;
  updateGW(gwNum, g => ({...g, locked: !g.locked}));
}
function calcPrizePot(memberCount){
  const prize = (DATA && DATA.prize) || DEFAULT_PRIZE;
  const entryFee = prize.entryFee ?? DEFAULT_PRIZE.entryFee;
  const first = prize.first ?? DEFAULT_PRIZE.first;
  const second = prize.second ?? DEFAULT_PRIZE.second;
  const third = prize.third ?? DEFAULT_PRIZE.third;
  const total = memberCount*entryFee;
  const allocated = first+second+third;
  return {total, entryFee, first, second, third, leftover: total-allocated, allocated};
}
function updatePrize(field, value){
  if(!isEditor) return;
  const num = value===""?"":Number(value);
  DATA.prize = {...(DATA.prize||DEFAULT_PRIZE), [field]: num};
  render();
}
function setPayment(memberId, value){
  if(!isEditor) return;
  const num = value===""?0:Number(value);
  DATA.payments = {...(DATA.payments||{}), [memberId]: num};
  render();
}
function getPayment(memberId){
  return (DATA.payments && DATA.payments[memberId]) || 0;
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// Alphabetical player order used throughout the Gameweek tab, so the
// column/row order stays identical week to week regardless of when
// someone was added or how they're doing in the table.
function sortedMembers(){ return [...DATA.members].sort((a,b)=>a.name.localeCompare(b.name)); }

// ---------- persistence ----------
async function loadData(){
  try{
    const res = await fetch('./data.json?t=' + Date.now());
    DATA = await res.json();
  }catch(e){
    DATA = { members: [], gameweeks: {}, prize: {...DEFAULT_PRIZE} };
  }
}

function ghInfo(){
  const host = location.hostname; // e.g. someuser.github.io
  const owner = host.split(".")[0];
  const parts = location.pathname.split("/").filter(Boolean);
  const repo = parts[0] || "";
  return {owner, repo};
}

async function publishLive(){
  const {owner, repo} = ghInfo();
  if(!owner || !repo){
    showManualExport("Couldn't work out your GitHub repo from the URL — use the manual copy method below.");
    return;
  }
  if(!ghToken){
    ghToken = prompt("Paste your GitHub personal access token (Contents: Read & write on this repo). It's saved only in this browser.");
    if(!ghToken) return;
    localStorage.setItem("gh-token", ghToken);
  }
  const statusEl = document.getElementById("publishStatus");
  statusEl.textContent = "Publishing…";
  try{
    const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
      headers: { Authorization: `token ${ghToken}` }
    });
    if(!getRes.ok) throw new Error("Couldn't read current data.json (" + getRes.status + ")");
    const getJson = await getRes.json();
    const sha = getJson.sha;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
      method: "PUT",
      headers: { Authorization: `token ${ghToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Update league data", content, sha })
    });
    if(!putRes.ok){
      const errBody = await putRes.text();
      throw new Error("GitHub rejected the update (" + putRes.status + "): " + errBody.slice(0,200));
    }
    statusEl.textContent = "Published — live for everyone.";
    setTimeout(()=>{ statusEl.textContent = ""; }, 4000);
  }catch(e){
    statusEl.textContent = "";
    showManualExport("Automatic publish failed: " + e.message);
  }
}

function showManualExport(reason){
  const json = JSON.stringify(DATA, null, 2);
  const box = document.getElementById("manualExport");
  box.style.display = "block";
  box.querySelector(".reason").textContent = reason;
  box.querySelector("textarea").value = json;
}

function forgetToken(){
  ghToken = "";
  localStorage.removeItem("gh-token");
  alert("Token forgotten on this device.");
}

// ---------- editor lock ----------
function onLockPillClick(){
  if(isEditor){
    isEditor = false;
  } else {
    const entered = prompt("Enter the PIN to enable editing:");
    if(entered === null) return;
    if(entered.trim() === EDITOR_PIN){ isEditor = true; }
    else { alert("Incorrect PIN."); return; }
  }
  render();
}

// ---------- mutations (editor only, all guarded) ----------
function updateGW(n, updater){
  if(!isEditor) return;
  const cur = getGW(n);
  DATA.gameweeks[n] = updater(cur);
  render();
}
function addFixture(home, away){
  if(!isEditor || getGW(gwNum).locked || !home.trim() || !away.trim()) return;
  updateGW(gwNum, g => ({...g, fixtures:[...g.fixtures, {id:makeId("fx"), home:home.trim(), away:away.trim(), actualHome:"", actualAway:""}]}));
}
function removeFixture(fxId){
  if(!isEditor || getGW(gwNum).locked) return;
  updateGW(gwNum, g => {
    const predictions = {};
    Object.entries(g.predictions).forEach(([mid,preds])=>{ const {[fxId]:_, ...rest} = preds; predictions[mid]=rest; });
    const chips = {};
    Object.entries(g.chips).forEach(([mid,c])=>{ chips[mid] = c.tripleFixtureId===fxId ? {...c, tripleFixtureId:null} : c; });
    return {...g, fixtures: g.fixtures.filter(f=>f.id!==fxId), predictions, chips};
  });
}
function setActual(fxId, field, value){
  if(!isEditor || getGW(gwNum).locked) return;
  updateGW(gwNum, g => ({...g, fixtures: g.fixtures.map(f=>f.id===fxId?{...f,[field]:value}:f)}));
}
function setPrediction(memberId, fxId, field, value){
  if(!isEditor || getGW(gwNum).locked) return;
  updateGW(gwNum, g => ({...g, predictions:{...g.predictions, [memberId]:{...(g.predictions[memberId]||{}), [fxId]:{...((g.predictions[memberId]||{})[fxId]||{home:"",away:""}), [field]:value}}}}));
}
function toggleDouble(memberId){
  if(!isEditor || getGW(gwNum).locked) return;
  const gw = getGW(gwNum); const half = seasonHalf(gwNum);
  const current = gw.chips[memberId] || {double:false, tripleFixtureId:null};
  if(!current.double){
    const usage = chipUsageExcluding(memberId, half, gwNum);
    if(usage.double>=1){ alert("Already used Double Gameweek once this half — it can only be used once per half of the season."); return; }
  }
  updateGW(gwNum, g => { const c=g.chips[memberId]||{double:false,tripleFixtureId:null}; return {...g, chips:{...g.chips,[memberId]:{...c,double:!c.double}}}; });
}
function setTripleFixture(memberId, fxId){
  if(!isEditor || getGW(gwNum).locked) return;
  const gw = getGW(gwNum); const half = seasonHalf(gwNum);
  const current = gw.chips[memberId] || {double:false, tripleFixtureId:null};
  const turningOn = !current.tripleFixtureId && fxId;
  if(turningOn){
    const usage = chipUsageExcluding(memberId, half, gwNum);
    if(usage.triple>=1){ alert("Already used Triple Fixture once this half — it can only be used once per half of the season."); return; }
  }
  updateGW(gwNum, g => { const c=g.chips[memberId]||{double:false,tripleFixtureId:null}; return {...g, chips:{...g.chips,[memberId]:{...c,tripleFixtureId: fxId||null}}}; });
}
function addMember(name){
  if(!isEditor || !name.trim()) return;
  DATA.members.push({id:makeId("m"), name:name.trim()});
  render();
}
function renameMember(id, name){
  if(!isEditor) return;
  DATA.members = DATA.members.map(m=>m.id===id?{...m,name}:m);
}
function removeMember(id){
  if(!isEditor) return;
  DATA.members = DATA.members.filter(m=>m.id!==id);
  render();
}

// ---------- rendering ----------
function render(){
  // Preserve scroll position across the DOM rebuild below — otherwise every
  // edit snaps the page back to the top and the predictions table back to
  // its leftmost column.
  const pageScrollY = window.scrollY;
  const predWrapOld = document.getElementById("predWrap");
  const predScrollLeft = predWrapOld ? predWrapOld.scrollLeft : null;

  document.getElementById("lockPill").outerHTML = isEditor
    ? `<span id="lockPill" class="pill unlocked" onclick="onLockPillClick()">✓ Editing enabled · tap to lock</span>`
    : `<span id="lockPill" class="pill" onclick="onLockPillClick()">View only · tap to unlock editing</span>`;

  const tickerEl = document.getElementById("tickerTrack");
  if(tickerEl) tickerEl.innerHTML = renderTicker();

  const tabs = [
    {id:"standings", label:"Standings"},
    {id:"gameweek", label:"Gameweek"},
    {id:"payments", label:"Payments"},
  ];
  if(isEditor) tabs.push({id:"members", label:"Members"});
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<button class="tab ${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join("");

  const content = document.getElementById("content");
  if(activeTab==="standings") content.innerHTML = renderStandings();
  else if(activeTab==="gameweek") content.innerHTML = renderGameweek();
  else if(activeTab==="payments") content.innerHTML = renderPayments();
  else if(activeTab==="members" && isEditor) content.innerHTML = renderMembers();
  wireEvents();

  const predWrapNew = document.getElementById("predWrap");
  if(predWrapNew && predScrollLeft !== null) predWrapNew.scrollLeft = predScrollLeft;
  window.scrollTo(0, pageScrollY);
}
function setTab(id){ activeTab=id; render(); }

function computeStandings(){
  return DATA.members.map(m=>{
    let total=0, gwsPlayed=0, exactScores=0;
    Object.values(DATA.gameweeks).forEach(g=>{
      const {total:t, anyScored, exactCount} = gwMemberPoints(g, m.id);
      if(anyScored){ total+=t; gwsPlayed++; exactScores+=exactCount; }
    });
    return {...m, total, gwsPlayed, exactScores};
  }).sort((a,b)=> b.total-a.total || b.exactScores-a.exactScores || a.name.localeCompare(b.name));
}
function computeGWWinners(n){
  const gw = getGW(n);
  if(!gw.fixtures || gw.fixtures.length===0) return [];
  const results = [];
  DATA.members.forEach(m=>{
    const {total, anyScored, exactCount} = gwMemberPoints(gw, m.id);
    if(anyScored) results.push({id:m.id, name:m.name, points:total, exact:exactCount});
  });
  if(results.length===0) return [];
  const maxPoints = Math.max(...results.map(r=>r.points));
  const topByPoints = results.filter(r=>r.points===maxPoints);
  if(topByPoints.length===1) return topByPoints;
  // Tied on points — break the tie by whoever had the most exact scores that gameweek.
  const maxExact = Math.max(...topByPoints.map(r=>r.exact));
  return topByPoints.filter(r=>r.exact===maxExact);
}
function computeGWWinner(n){
  const winners = computeGWWinners(n);
  if(winners.length===0) return null;
  return { name: winners.map(w=>w.name).join(' & '), points: winners[0].points, exact: winners[0].exact };
}
function generateTickerItems(){
  const currentGW = DATA.currentGameweek;
  const items = [];
  items.push(currentGW ? `Gameweek ${currentGW} live` : `Season kicks off soon`);
  const pot = calcPrizePot(DATA.members.length);
  items.push(`Prize pot £${pot.total}`);
  const winner = currentGW ? computeGWWinner(currentGW) : null;
  if(winner) items.push(`Top scorer: ${winner.name} ${winner.points}pts`);
  const totalPaid = sortedMembers().reduce((s,m)=> s+getPayment(m.id), 0);
  items.push(`£${totalPaid} collected of £${pot.total}`);
  items.push(`Predictions close 1 min before kick-off`);
  return items;
}
function renderTicker(){
  const items = generateTickerItems();
  const html = items.map(t=>`<span class="ticker-item">${esc(t)}</span><span class="ticker-sep">★</span>`).join("");
  return html + html; // duplicated once for a seamless scrolling loop
}

function generateFixturesSummary(n){
  const gw = getGW(n);
  const lines = [];
  lines.push(`⚽ Gameweek ${n} Fixtures`);
  lines.push('');
  if(gw.fixtures.length === 0){
    lines.push('(No fixtures added yet)');
  } else {
    gw.fixtures.forEach((fx,i)=> lines.push(`${i+1}. ${fx.home} v ${fx.away}`));
  }
  return lines.join('\n');
}
async function copyFixturesSummary(){
  const text = generateFixturesSummary(gwNum);
  try{
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById("copyFixturesBtn");
    if(btn){ const old = btn.textContent; btn.textContent = "✓ Copied!"; setTimeout(()=>{ btn.textContent = old; }, 2000); }
  }catch(e){
    window.prompt("Copy this text manually:", text);
  }
}

function renderStandings(){
  const gwCount = Object.keys(DATA.gameweeks).length;
  const pot = calcPrizePot(DATA.members.length);
  const standings = computeStandings();

  const prizeRow = (label, field, amount, color) => isEditor ? `
    <div style="text-align:center;padding:12px 0;">
      <div style="font-size:11px;text-transform:uppercase;color:#888;">${label}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:2px;">
        <span class="disp" style="font-size:18px;font-weight:600;color:${color};">£</span>
        <input type="number" min="0" class="disp" data-prize="${field}" value="${amount}" style="width:76px;text-align:center;font-size:18px;font-weight:600;color:${color};border:1px solid var(--borderInput);border-radius:6px;padding:2px 0;" />
      </div>
    </div>` : `
    <div style="text-align:center;padding:12px 0;">
      <div style="font-size:11px;text-transform:uppercase;color:#888;">${label}</div>
      <div class="disp" style="font-size:20px;font-weight:600;color:${color};">£${amount}</div>
    </div>`;

  const currentGW = DATA.currentGameweek || gwNum || 1;
  const gwWinner = computeGWWinner(currentGW);

  return `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
      <h2 style="font-size:20px;font-weight:600;margin:0;">League Table</h2>
      <span style="font-size:12px;color:#888;">${gwCount} gameweek${gwCount===1?'':'s'} recorded</span>
    </div>
    ${gwWinner ? `
    <div style="margin-bottom:12px;padding:8px 12px;border-radius:8px;background:#D9FFEF;color:#0A5C39;font-size:13px;font-weight:600;">
      🏆 GW${currentGW} top scorer: ${esc(gwWinner.name)} (${gwWinner.points}pts)
    </div>` : ``}
    <div class="card" style="margin-bottom:16px;">
      <div style="background:var(--navy);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Prize Pot</span>
        <span style="font-size:12px;color:#8CA0B3;display:flex;align-items:center;gap:4px;">
          ${DATA.members.length} players ·

function renderPayments(){
  const members = sortedMembers();
  const entryFee = (DATA.prize && DATA.prize.entryFee) || DEFAULT_PRIZE.entryFee;
  const target = members.length * entryFee;
  const totalPaid = members.reduce((sum,m)=> sum + getPayment(m.id), 0);
  const weeksSoFar = DATA.currentGameweek || Object.keys(DATA.gameweeks).length || 0;
  const expectedSoFar = weeksSoFar * 2; // £2 per week, per the league rules
  return `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
      <h2 style="font-size:20px;font-weight:600;margin:0;">Payments</h2>
      <span style="font-size:12px;color:#888;">£${entryFee} per player this season</span>
    </div>
    <p style="font-size:12px;color:#888;margin-bottom:12px;">
      ${isEditor ? "Tap any amount to update how much that player has paid so far." : "View only — running total of what everyone has paid in so far."}
      ${expectedSoFar>0 ? ` Expected by now: £${expectedSoFar} (£2 × ${weeksSoFar} weeks).` : ``}
    </p>
    ${members.length===0 ? `<div class="empty">No members yet.</div>` : `
    <div class="card">
      <div style="display:flex;flex-direction:column;">
        ${members.map((m,i)=>{
          const paid = getPayment(m.id);
          const owing = expectedSoFar - paid;
          return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;${i>0?'border-top:1px solid var(--border);':''}background:${i%2===0?'#fff':'var(--zebra)'};">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:14px;font-weight:500;">${esc(m.name)}</span>
              ${owing>0 ? `<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:#FBE4E4;color:var(--red);">owes £${owing}</span>` : expectedSoFar>0 ? `<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:#D9FFEF;color:#0A5C39;">up to date</span>` : ``}
            </div>
            ${isEditor ? `
              <div style="display:flex;align-items:center;gap:2px;">
                <span class="disp" style="font-size:14px;font-weight:600;color:var(--navyMid);">£</span>
                <input type="number" min="0" data-payment="${m.id}" value="${paid}" class="disp" style="width:70px;text-align:right;font-size:14px;font-weight:600;color:var(--navyMid);border:1px solid var(--borderInput);border-radius:6px;padding:3px 6px;" />
              </div>
            ` : `
              <span class="disp" style="font-size:14px;font-weight:600;color:var(--navyMid);">£${paid}</span>
            `}
          </div>`;
        }).join("")}
      </div>
      <div style="padding:12px 14px;border-top:2px solid var(--navy);display:flex;justify-content:space-between;align-items:center;background:#FAF8FC;">
        <span style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--navy);">Total collected</span>
        <span class="disp" style="font-size:18px;font-weight:700;color:var(--navy);">£${totalPaid} <span style="font-size:12px;font-weight:500;color:#888;">of £${target} target</span></span>
      </div>
    </div>`}
  `;
}

// ---------- event wiring (since we render via innerHTML) ----------
function wireEvents(){
  document.querySelectorAll('[data-actual]').forEach(el=>{
    el.addEventListener('change', e=>{
      const [fxId, field] = e.target.dataset.actual.split(":");
      setActual(fxId, field, e.target.value);
    });
  });
  document.querySelectorAll('[data-pred]').forEach(el=>{
    el.addEventListener('change', e=>{
      const [mid, fxId, field] = e.target.dataset.pred.split(":");
      setPrediction(mid, fxId, field, e.target.value);
    });
  });
  document.querySelectorAll('[data-double]').forEach(el=>{
    el.addEventListener('click', e=> toggleDouble(e.currentTarget.dataset.double));
  });
  document.querySelectorAll('[data-triple]').forEach(el=>{
    el.addEventListener('click', e=>{
      const [mid, fxId] = e.currentTarget.dataset.triple.split(":");
      const gw = getGW(gwNum); const chip = gw.chips[mid] || {};
      setTripleFixture(mid, chip.tripleFixtureId===fxId ? "" : fxId);
    });
  });
  document.querySelectorAll('[data-payment]').forEach(el=>{
    el.addEventListener('change', e=> setPayment(e.target.dataset.payment, e.target.value));
  });
  document.querySelectorAll('[data-prize]').forEach(el=>{
    el.addEventListener('change', e=> updatePrize(e.target.dataset.prize, e.target.value));
  });
  document.querySelectorAll('[data-removefx]').forEach(el=>{
    el.addEventListener('click', e=> removeFixture(e.currentTarget.dataset.removefx));
  });
  document.querySelectorAll('[data-rename]').forEach(el=>{
    el.addEventListener('change', e=> renameMember(e.target.dataset.rename, e.target.value));
  });
  document.querySelectorAll('[data-removemember]').forEach(el=>{
    el.addEventListener('click', e=> removeMember(e.currentTarget.dataset.removemember));
  });
}
function onAddFixture(){
  const home = document.getElementById("newFxHome").value;
  const away = document.getElementById("newFxAway").value;
  addFixture(home, away);
  render();
}
function onAddMember(){
  addMember(document.getElementById("newMemberName").value);
}
function changeGW(delta){ gwNum = Math.min(TOTAL_GAMEWEEKS, Math.max(1, gwNum+delta)); render(); }
function jumpGW(v){ gwNum = +v; render(); }

// ---------- boot ----------
(async function(){
  await loadData();
  // Land on whichever gameweek has been explicitly marked "current" —
  // falls back to the highest gameweek with fixtures for older data that
  // doesn't have this set yet, or GW1 if nothing exists at all.
  if(DATA.currentGameweek){
    gwNum = DATA.currentGameweek;
  } else {
    const gwKeys = Object.keys(DATA.gameweeks)
      .filter(n => (DATA.gameweeks[n].fixtures || []).length > 0)
      .map(Number);
    if(gwKeys.length > 0) gwNum = Math.max(...gwKeys);
  }
  render();
})();

// Home Screen web apps often just "resume" the page instead of doing a
// fresh reload when reopened, so the tab can sit on stale data for hours.
// Force a re-check whenever the app becomes visible again, plus a periodic
// poll while it stays open — both scoped to View Only mode so an editor's
// unpublished changes are never silently overwritten.
async function refreshIfViewer(){
  if(isEditor) return;
  try{
    const res = await fetch('./data.json?t=' + Date.now());
    DATA = await res.json();
    render();
  }catch(e){
    // ignore transient failures, next check will retry
  }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') refreshIfViewer();
});
setInterval(refreshIfViewer, 20000);
</script>
